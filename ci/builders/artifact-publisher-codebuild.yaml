AWSTemplateFormatVersion: '2010-09-09'
Description: Packages and publishes a repository artifact to S3
Parameters:
  GitHubProjectName:
    Description: Name of the pagopa GitHub repository
    Type: String
  GitHubDefaultBranch:
    Description: Default GitHub branch
    Type: String
    Default: main
  BaseDir:
    Description: Repository directory to include in the package
    Type: String
    AllowedPattern: '[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*'
  BaseDirEscaped:
    Description: Directory identifier for the CodeBuild project name
    Type: String
  ArtifactName:
    Description: ZIP artifact filename
    Type: String
    AllowedPattern: '[A-Za-z0-9_-]+[.]zip'
  CiArtifactBucket:
    Description: CI artifact bucket name
    Type: String
  NotificationSNSTopic:
    Description: Topic for build and pipeline notification
    Type: String
  VpcId:
    Type: String
    Description: CodeBuild network VPC ID
    Default: vpc-0b672efeb65088a12
  SubnetsIds:
    Type: CommaDelimitedList
    Description: CodeBuild network subnet IDs
    Default: 'subnet-08026072a0eacdd71,subnet-068ed8dffa1ae786e,subnet-0d491d72cb030d323'
  SecurityGroupId:
    Type: String
    Description: CodeBuild network security group ID
    Default: sg-03a2c0bb8367596b2

Resources:
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${GitHubProjectName}-${BaseDirEscaped}-CodeBuild"
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      BadgeEnabled: true
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: GITHUB_PRJ_NAME
            Type: PLAINTEXT
            Value: !Ref GitHubProjectName
          - Name: SOURCE_DIR
            Type: PLAINTEXT
            Value: !Ref BaseDir
          - Name: ARTIFACT_NAME
            Type: PLAINTEXT
            Value: !Ref ArtifactName
          - Name: CI_BUCKET_NAME
            Type: PLAINTEXT
            Value: !Ref CiArtifactBucket
      SourceVersion: !Ref GitHubDefaultBranch
      Source:
        Type: GITHUB
        Location: !Sub 'https://github.com/pagopa/${GitHubProjectName}'
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            pre_build:
              on-failure: ABORT
              commands:
                - export COMMIT_ID="$CODEBUILD_RESOLVED_SOURCE_VERSION"
                - test -n "$COMMIT_ID"
                - test -d "$SOURCE_DIR"
                - |
                  if [ -n "$(find "$SOURCE_DIR" -type l -print -quit)" ]; then
                    echo "Symbolic links are not supported in ${SOURCE_DIR}" >&2
                    exit 1
                  fi
                  if [ -z "$(find "$SOURCE_DIR" -type f -print -quit)" ]; then
                    echo "No files found in ${SOURCE_DIR}" >&2
                    exit 1
                  fi
            build:
              on-failure: ABORT
              commands:
                - echo "Packaging ${SOURCE_DIR} for commit ${COMMIT_ID}"
                - '(cd "$(dirname "$SOURCE_DIR")" && zip -r "$CODEBUILD_SRC_DIR/$ARTIFACT_NAME" "$(basename "$SOURCE_DIR")")'
            post_build:
              on-failure: ABORT
              commands:
                - |
                  if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then
                    echo "Skipping artifact publication because the build failed"
                    exit 1
                  fi
                - echo "Publishing ${ARTIFACT_NAME} for commit ${COMMIT_ID}"
                - aws s3 cp "$CODEBUILD_SRC_DIR/$ARTIFACT_NAME" "s3://$CI_BUCKET_NAME/$GITHUB_PRJ_NAME/commits/$COMMIT_ID/$ARTIFACT_NAME"
      TimeoutInMinutes: 10
      Triggers:
        Webhook: true
        FilterGroups:
          - - Type: EVENT
              Pattern: PUSH
            - Type: HEAD_REF
              Pattern: ^refs/heads/(main|develop|(feature|feat|chore|hotfix|bug|fix|release)/.+)$
      VpcConfig:
        VpcId: !Ref VpcId
        Subnets: !Ref SubnetsIds
        SecurityGroupIds:
          - !Ref SecurityGroupId

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${GitHubProjectName}-${BaseDirEscaped}-CodeBuild'
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogsPolicy
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${GitHubProjectName}-${BaseDirEscaped}-CodeBuild:*'
              - Sid: PublishArtifact
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${CiArtifactBucket}/${GitHubProjectName}/commits/*/${ArtifactName}'
              - Sid: ArtifactBucketLocation
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${CiArtifactBucket}'
              - Sid: Ec2Permissions
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                Resource: '*'
              - Sid: NetworkInterfacePermission
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterfacePermission
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
                Condition:
                  StringEquals:
                    ec2:AuthorizedService: codebuild.amazonaws.com

  CodeBuildNotifications:
    Type: AWS::CodeStarNotifications::NotificationRule
    Properties:
      DetailType: FULL
      Name: !Sub '${GitHubProjectName}-${BaseDirEscaped}-CI'
      EventTypeIds:
        - codebuild-project-build-state-failed
      Resource: !GetAtt CodeBuildProject.Arn
      Targets:
        - TargetAddress: !Ref NotificationSNSTopic
          TargetType: SNS
