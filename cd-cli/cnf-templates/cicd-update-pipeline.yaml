AWSTemplateFormatVersion: '2010-09-09'
Description: Update the local SEND CD pipeline stack

# This stack is bootstrapped manually once per account and environment.
# One CodeBuild run updates this stack first, then the local Complete CD pipeline stack.
# Release revision: S3 in DEV, pn-configuration in other environments.
# Empty change sets are skipped.
# CodePipeline update behavior: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-edit.html#pipelines-edit-cli
Parameters:
  ProjectName:
    Type: String
    Default: pn
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9-]*'
  EnvName:
    Type: String
    AllowedValues: [dev, test, uat, hotfix, prod]
  accountType:
    Type: String
    Description: SEND account type
    AllowedValues: [CORE, CONFINFO]
  TargetStackName:
    Type: String
    Description: Existing local complete pipeline stack
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9-]*'
  ArtifactBucketName:
    Type: String
    Description: CdArtifactBucketName output of the target stack

Conditions:
  IsDev: !Equals [!Ref EnvName, dev]

Resources:
  UpdateBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ProjectName}-cicd-update
      Policies:
        - PolicyName: UpdatePipelines
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogGroup', 'logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-cicd-update:*
              - Effect: Allow
                Action: ['s3:GetBucketLocation', 's3:GetBucketVersioning']
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
              - Effect: Allow
                Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject']
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${ProjectName}-cicd-update/*
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/pn-cicd-update/*
              - !If
                - IsDev
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/config/desired-commit-ids-env.sh
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:github-token-*
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource:
                  - !Ref AWS::StackId
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${TargetStackName}/*
              - Effect: Allow
                Action: ['cloudformation:CreateChangeSet', 'cloudformation:DescribeChangeSet', 'cloudformation:ExecuteChangeSet', 'cloudformation:DeleteChangeSet']
                Resource:
                  - !Ref AWS::StackId
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${TargetStackName}/*
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName:
                      - pn-cicd-update-*
                      - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/pn-cicd-update-*/*
              - Effect: Allow
                Action: ['codepipeline:GetPipeline', 'codepipeline:UpdatePipeline', 'codepipeline:ListTagsForResource', 'codepipeline:TagResource', 'codepipeline:UntagResource']
                Resource: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-*
              - Effect: Allow
                Action: codepipeline:ListPipelineExecutions
                Resource:
                  - !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-*
                  - !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:go-automation-update-pipeline
              - Effect: Allow
                Action: ['codebuild:BatchGetProjects', 'codebuild:UpdateProject']
                Resource: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ProjectName}-*
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${TargetStackName}-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-cd-pipeline-CodeBuildRole
                Condition:
                  StringEquals:
                    iam:PassedToService: [codepipeline.amazonaws.com, codebuild.amazonaws.com]

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunUpdater
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetBucketLocation', 's3:GetBucketVersioning', 's3:GetBucketAcl']
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
              - Effect: Allow
                Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject']
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/empty.zip
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${ProjectName}-cicd-update/*
              - Effect: Allow
                Action: ['codebuild:StartBuild', 'codebuild:BatchGetBuilds']
                Resource:
                  - !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ProjectName}-cicd-update
                  - !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:build/${ProjectName}-cicd-update:*

  UpdateBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${ProjectName}-cicd-update
      ServiceRole: !GetAtt UpdateBuildRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 60
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: ENV_NAME
            Value: !Ref EnvName
          - Name: ACCOUNT_TYPE
            Value: !Ref accountType
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
          - Name: ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: AWS_PARTITION
            Value: !Ref AWS::Partition
          - Name: UPDATER_STACK
            Value: !Ref AWS::StackName
          - Name: TARGET_STACK
            Value: !Ref TargetStackName
          - Name: ARTIFACT_BUCKET
            Value: !Ref ArtifactBucketName
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - |
                  set -euo pipefail
                  export AWS_PAGER='' AWS_RETRY_MODE=standard AWS_MAX_ATTEMPTS=3
                  work=$(mktemp -d)
                  if [[ "$ENV_NAME" == dev ]]; then
                    aws --region "$AWS_REGION" s3api get-object --bucket "$ARTIFACT_BUCKET" \
                      --expected-bucket-owner "$ACCOUNT_ID" --key config/desired-commit-ids-env.sh "$work/desired-commit-ids-env.sh" >/dev/null
                    ref=$(awk '
                      /^[[:blank:]]*(export[[:blank:]]+)?cd_scripts_commitId=/ {
                        sub(/^[^=]*=/, "")
                        sub(/[[:space:]]+$/, "")
                        if (/^".*"$/ || /^\047.*\047$/) $0 = substr($0, 2, length($0) - 2)
                        ref = $0
                        count++
                      }
                      END { if (count != 1) exit 1; print ref }
                    ' "$work/desired-commit-ids-env.sh") || { echo 'Missing or duplicate cd_scripts_commitId' >&2; exit 1; }
                  else
                    token=$(aws --region "$AWS_REGION" secretsmanager get-secret-value --secret-id github-token --query SecretString --output text)
                    [[ -n $token && $token != None ]] || { echo 'Missing GitHub credential' >&2; exit 1; }
                    authorization=$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')
                    GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
                      GIT_CONFIG_VALUE_0="Authorization: Basic $authorization" \
                      git clone --branch main https://github.com/pagopa/pn-configuration.git "$work/pn-configuration"
                    unset token authorization
                    ref=$(jq -er '.cd_scripts_commitId | select(type == "string")' \
                      "$work/pn-configuration/$ENV_NAME/repository-list.json")
                  fi
                  [[ $ref =~ ^[[:alnum:]][[:alnum:]_./-]*$ ]] || { echo 'Invalid cd_scripts_commitId' >&2; exit 1; }
                  git clone https://github.com/pagopa/pn-cicd.git "$work/pn-cicd"
                  cd "$work/pn-cicd"
                  case "$ref" in tag/*) ref="refs/tags/${ref#tag/}" ;; esac
                  commit=$(git rev-parse --verify --end-of-options "$ref^{commit}" 2>/dev/null ||
                    git rev-parse --verify --end-of-options "refs/remotes/origin/$ref^{commit}")
                  git checkout --detach "$commit"
                  bash cd-cli/updateCdPipelines.sh

  UpdatePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${ProjectName}-cicd-update
      PipelineType: V2
      ExecutionMode: QUEUED
      RestartExecutionOnUpdate: false
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                S3Bucket: !Ref ArtifactBucketName
                S3ObjectKey: empty.zip
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: Source
        - Name: Update
          Actions:
            - Name: Update
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref UpdateBuild
              InputArtifacts:
                - Name: Source

Outputs:
  PipelineName:
    Value: !Ref UpdatePipeline
